<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Excel点検表 入力ツール（試作版）</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#1a2330;--sub:#566477;--line:#d3dbe6;--acc:#1f5fa8;--acc-ink:#fff;--soft:#e5eef9;--head:#1f5fa8;--head-ink:#fff;
--ok:#1f7a4d;--ng:#c0392b;--na:#6b7280;--warn:#8a5a00;--warnbg:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a212b;--ink:#e6ecf4;--sub:#a5b4c6;--line:#313c4b;--acc:#7db4f5;--acc-ink:#0b1726;--soft:#1e2b3d;--head:#1c3f6e;--head-ink:#f2f6fb;
--ok:#4cc38a;--ng:#ff7b6b;--na:#9aa3ad;--warn:#ffd27a;--warnbg:#3a2f12}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 90px}
header.top{background:var(--head);color:var(--head-ink)}
header.top .in{max-width:820px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:16px;margin:0;flex:1;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top small{display:block;font-weight:400;opacity:.85;font-size:12px}
header.top button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;cursor:pointer}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.tabs button{flex:1 1 auto;font-size:15px;line-height:1.3;padding:12px 4px;border:0;background:none;border-bottom:3px solid transparent;cursor:pointer;color:var(--sub);font-weight:600}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}
.card h2{font-size:15px;margin:0 0 10px}
.card h2 small{font-weight:400;color:var(--sub);margin-left:6px}
p.note{color:var(--sub);font-size:13px;margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px;font-weight:500}
.btn.danger{color:var(--ng)}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:13px;color:var(--sub);margin-bottom:2px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:42px}
textarea{resize:vertical;min-height:58px;field-sizing:content;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.trow{border-top:1px dashed var(--line);padding:8px 0}
.trow.sel{background:var(--soft);margin:0 -8px;padding:8px;border-radius:8px;border-top-color:transparent}
.trow b{font-size:14px}
.sess{display:flex;gap:10px;align-items:center}
.sess .meta{flex:1;min-width:0}
.sess .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .meta span{font-size:12.5px;color:var(--sub);display:block}
.bar{position:sticky;top:47px;z-index:10;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
.bar .r{display:flex;gap:8px;align-items:center}
.bar select{min-height:40px;padding:6px 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:13px;color:var(--sub)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--acc)}
.norm{margin:16px 0 6px;padding:10px 12px;background:var(--soft);border-radius:10px;border-left:4px solid var(--acc)}
.norm .nid{font-weight:700;margin-right:6px}
.norm .fld{display:inline-block;font-size:12px;border:1px solid var(--acc);color:var(--acc);border-radius:4px;padding:0 6px;margin-left:4px;white-space:nowrap}
.norm details{margin-top:6px;font-size:13.5px;color:var(--sub)}
.norm details div{white-space:pre-wrap;margin-top:4px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.item.done{border-left:4px solid var(--acc)}
.ihead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.iid{font-weight:700;font-variant-numeric:tabular-nums}
.kb{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.ihead select{width:auto;min-height:32px;padding:2px 6px;font-size:13px}
.itext{white-space:pre-wrap;margin-bottom:10px}
.choices{display:flex;gap:8px;margin-bottom:8px}
.ch{flex:1;min-height:50px;font-size:22px;font-weight:700;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer}
.ch.c0.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.c1.on{background:var(--ng);border-color:var(--ng);color:#fff}
.ch.c2.on,.ch.c3.on{background:var(--na);border-color:var(--na);color:#fff}
.ro{font-size:13.5px;background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;white-space:pre-wrap}
.ro b{margin-right:6px}
.ro .v{font-weight:700;font-size:16px;margin-right:6px}
.ro .lab{display:inline-block;font-size:12px;color:var(--sub);margin-right:6px}
.nav{display:flex;gap:8px;margin:18px 0}
.nav .btn{flex:1}
.warn{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:10px 0}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.stat div{flex:1;min-width:90px;background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;max-width:90vw;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;font-size:14px}
#toast.on{opacity:.95}
.empty{text-align:center;color:var(--sub);padding:24px 0}
ol.how{padding-left:1.3em;margin:6px 0;font-size:14px;color:var(--sub)}
.refs{margin-bottom:8px}
.ref{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px}
.ref .rl{color:var(--sub);font-size:12px}.ref .vv{font-size:16px}
.ref .rc{flex:1 1 100%;white-space:pre-wrap}
.pvc{margin-left:auto;border:1px solid var(--acc);color:var(--acc);background:var(--card);border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;cursor:pointer}
:root{--memo:#7a4fb5}@media (prefers-color-scheme:dark){:root{--memo:#c3a4f0}}
.mm{margin-top:6px}.mbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mm .mmt{border:0;background:none;color:var(--memo);font-weight:600;cursor:pointer;padding:4px 0;font-size:14px}
.mm.open .mmt{display:none}
.chk{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.chk.on{background:var(--warnbg);border-color:var(--warn);color:var(--warn);font-weight:700}
.mbody{display:none;margin-top:6px;padding:8px 10px;border:1px dashed var(--memo);border-radius:10px;background:color-mix(in srgb,var(--memo) 7%,var(--card))}
.mm.open .mbody{display:block}
.mnote{font-size:12px;color:var(--memo);font-weight:600;margin-bottom:6px}
.phs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.pth{padding:0;border:1px solid var(--line);border-radius:8px;width:64px;height:64px;overflow:hidden;background:var(--soft);cursor:pointer}
.pth.miss{opacity:.4}
.pth canvas{width:100%;height:100%;display:block}
.pth,.pth canvas,.pvbig{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.pvbig{display:block;max-width:100%;max-height:62vh;width:auto;height:auto;margin:0 auto 10px;border-radius:8px}
.phn{margin-top:6px;font-size:12px;color:var(--warn);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{background:var(--card);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
.sheet h2{font-size:15px;margin:0 0 10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.plab{font-size:13px;font-weight:700;color:var(--acc);margin:10px 0 4px}
.wm{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;margin:6px 0}
.bar input[type=search]{min-height:40px;margin-top:6px;border-radius:999px;padding:6px 16px;-webkit-appearance:none;appearance:none;color:var(--ink)}
::placeholder{color:var(--sub);opacity:1}
.chip b{font-weight:700}
#pg{font-weight:700;color:var(--ink)}
.sech{font-size:15px;margin:22px 0 0;padding-bottom:4px;border-bottom:2px solid var(--acc);color:var(--acc)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl tr:first-child th,.tbl tr:first-child td{border-top:0}
.tbl th{white-space:nowrap;color:var(--sub);font-weight:600;width:7.5em}
a{color:var(--acc);word-break:break-all}
.card p{margin:0 0 8px}.card p:last-child{margin-bottom:0}
.card ul{margin:0;padding-left:1.3em}
pre.lic{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:8px;margin:8px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal"></div>
<input type="file" id="filePhoto" accept="image/*" capture="environment" hidden>
<input type="file" id="filePrev" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
<input type="file" id="fileNew" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
<input type="file" id="fileAdd" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>

const linkify=t=>esc(t).replace(/https?:\/\/[\x21-\x7e]+/g,u=>{const m=/(&quot;|&#39;|&gt;|[.,;:)\]])+$/.exec(u),tail=m?m[0]:'';if(tail)u=u.slice(0,-tail.length);return`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>${tail}`});
function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms)}

/* ================= Excel(xlsx) 読み書き =================
   元ファイルを展開し、入力セルの値だけを書き換えて再圧縮する。
   書式・画像・保護・印刷設定などには触れない。 */
function siText(si){let s='';for(const n of si.children){if(n.localName==='t')s+=n.textContent;else if(n.localName==='r'){for(const t of n.children)if(t.localName==='t')s+=t.textContent}}return s}
function openBook(bytes){
  let files;
  try{files=fflate.unzipSync(new Uint8Array(bytes))}catch(e){throw new Error('Excelファイル(.xlsx)として開けませんでした')}
  if(!files['xl/workbook.xml'])throw new Error('Excelファイル(.xlsx)ではないようです');
  const txt=p=>dec.decode(files[p]);
  const rel={};
  for(const r of parseXml(txt('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship'))rel[r.getAttribute('Id')]=r.getAttribute('Target');
  const sheets=[...parseXml(txt('xl/workbook.xml')).getElementsByTagName('sheet')].map(s=>{
    const t=rel[s.getAttribute('r:id')]||'';return{name:s.getAttribute('name'),path:t.startsWith('/')?t.slice(1):'xl/'+t}});
  let sstDoc=null;const sst=[];
  if(files['xl/sharedStrings.xml']){sstDoc=parseXml(txt('xl/sharedStrings.xml'));for(const si of sstDoc.documentElement.children)if(si.localName==='si')sst.push(siText(si))}
  let xfs=[],stDoc=null;
  if(files['xl/styles.xml']){
    const st=stDoc=parseXml(txt('xl/styles.xml'));
    const numFmts={};for(const n of st.getElementsByTagName('numFmt'))numFmts[n.getAttribute('numFmtId')]=n.getAttribute('formatCode')||'';
    const fontsEl=st.getElementsByTagName('fonts')[0];
    const fonts=fontsEl?[...fontsEl.children].map(f=>{const z=f.getElementsByTagName('sz')[0];return z?+z.getAttribute('val'):11}):[];
    const cx=st.getElementsByTagName('cellXfs')[0];
    xfs=cx?[...cx.children].map(x=>{
      const p=x.getElementsByTagName('protection')[0];const id=+(x.getAttribute('numFmtId')||0);
      let date=(id>=14&&id<=22)||(id>=27&&id<=36)||(id>=45&&id<=47)||(id>=50&&id<=58);
      if(!date&&numFmts[id]){const code=numFmts[id].replace(/"[^"]*"/g,'').replace(/\[[^\]]*\]/g,'').replace(/\\./g,'');date=/[ymd]/i.test(code)&&!/general/i.test(code)}
      return{locked:!(p&&p.getAttribute('locked')==='0'),date,sz:fonts[+(x.getAttribute('fontId')||0)]||11}}):[];
  }
  return{files,sheets,sst,sstDoc,sstIdx:null,xfs,stDoc,stDirty:false,xfSmall:{},loaded:{}};
}
function getSheet(book,path){
  if(book.loaded[path])return book.loaded[path];
  const doc=parseXml(dec.decode(book.files[path]));
  const cells=new Map(),rows=new Map();
  const sd=doc.getElementsByTagName('sheetData')[0];
  for(const row of sd.children){rows.set(+row.getAttribute('r'),row);for(const c of row.children)cells.set(c.getAttribute('r'),c)}
  const covered=new Set();
  for(const m of doc.getElementsByTagName('mergeCell')){
    const[a,b]=m.getAttribute('ref').split(':');if(!b)continue;const A=splitRef(a),B=splitRef(b);
    if((B.r-A.r+1)*(B.c-A.c+1)>2000)continue;
    for(let r=A.r;r<=B.r;r++)for(let c=A.c;c<=B.c;c++)if(r!==A.r||c!==A.c)covered.add(colName(c)+r)}
  const cols=[];for(const c of doc.getElementsByTagName('col'))cols.push({min:+c.getAttribute('min'),max:+c.getAttribute('max'),w:+c.getAttribute('width')});
  return book.loaded[path]={doc,cells,rows,covered,cols,sd,dirty:false,path};
}
function cellRaw(book,sh,ref){
  const c=sh.cells.get(ref);if(!c)return'';const t=c.getAttribute('t');
  if(t==='inlineStr'){const is=c.getElementsByTagName('is')[0];return is?siText(is):''}
  const v=c.getElementsByTagName('v')[0];if(!v)return'';
  if(t==='s')return book.sst[+v.textContent]??'';
  return v.textContent;
}
const xfOf=(book,sh,ref)=>{const c=sh.cells.get(ref);return(c&&book.xfs[+(c.getAttribute('s')||0)])||{locked:true,date:false,sz:11}};
const unlocked=(book,sh,ref)=>sh.cells.has(ref)&&!sh.covered.has(ref)&&!xfOf(book,sh,ref).locked;
function makeCell(sh,ref){
  const{r,c}=splitRef(ref);let row=sh.rows.get(r);
  if(!row){row=sh.doc.createElementNS(NS,'row');row.setAttribute('r',r);
    let before=null;for(const x of sh.sd.children)if(+x.getAttribute('r')>r){before=x;break}
    sh.sd.insertBefore(row,before);sh.rows.set(r,row)}
  const el=sh.doc.createElementNS(NS,'c');el.setAttribute('r',ref);
  let before=null;for(const x of row.children)if(splitRef(x.getAttribute('r')).c>c){before=x;break}
  row.insertBefore(el,before);sh.cells.set(ref,el);return el;
}
function sstIndex(book,val){
  if(!book.sstIdx){book.sstIdx=new Map();book.sst.forEach((s,i)=>{if(!book.sstIdx.has(s))book.sstIdx.set(s,i)})}
  let i=book.sstIdx.get(val);if(i!=null)return i;
  const root=book.sstDoc.documentElement;
  const si=book.sstDoc.createElementNS(NS,'si'),t=book.sstDoc.createElementNS(NS,'t');
  t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=val;si.appendChild(t);
  let ext=null;for(const x of root.children)if(x.localName==='extLst')ext=x;
  root.insertBefore(si,ext);
  i=book.sst.length;book.sst.push(val);book.sstIdx.set(val,i);
  if(root.hasAttribute('uniqueCount'))root.setAttribute('uniqueCount',book.sst.length);
  return i;
}
function setCell(book,sh,ref,val,isNum){
  const c=sh.cells.get(ref)||makeCell(sh,ref);
  while(c.firstChild)c.removeChild(c.firstChild);
  if(val===''){c.removeAttribute('t')}
  else if(isNum){c.removeAttribute('t');const v=sh.doc.createElementNS(NS,'v');v.textContent=val;c.appendChild(v)}
  else if(book.sstDoc){c.setAttribute('t','s');const v=sh.doc.createElementNS(NS,'v');v.textContent=sstIndex(book,val);c.appendChild(v);
    const root=book.sstDoc.documentElement;if(root.hasAttribute('count'))root.setAttribute('count',+root.getAttribute('count')+1)}
  else{c.setAttribute('t','inlineStr');const is=sh.doc.createElementNS(NS,'is'),t=sh.doc.createElementNS(NS,'t');
    t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=val;is.appendChild(t);c.appendChild(is)}
  sh.dirty=true;
}
function readDate(book,sh,ref){
  const raw=cellRaw(book,sh,ref);if(raw==='')return'';
  const c=sh.cells.get(ref),t=c.getAttribute('t');
  if(!t||t==='n'){const n=+raw;if(isFinite(n)&&n>1)return isoFromSerial(n)}
  const m=/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/.exec(raw);return m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):'';
}
const colPx=(sh,c)=>{let w=8.43;for(const k of sh.cols)if(c>=k.min&&c<=k.max){w=k.w;break}return w*7+5};
/* 「生○／団✕」のようにまとめた結果が列幅からはみ出ないよう、そのセルだけ文字を小さくする（12pt以下）。
   元のセル書式を複製して文字サイズだけ変えた書式を styles.xml に追加する */
function shrinkFont(book,sh,ref,text){
  const c=sh.cells.get(ref);if(!c||!book.stDoc||!text)return;
  let u=0;for(const line of text.split('\n')){let n=0;for(const ch of line)n+=ch.charCodeAt(0)<0x100?0.5:1;u=Math.max(u,n)}
  if(u<=1)return;
  const s=+(c.getAttribute('s')||0),xf=book.xfs[s];if(!xf)return;
  const sz=Math.max(8,Math.min(12,Math.floor((colPx(sh,splitRef(ref).c)-8)*0.75/u)));
  if(xf.sz<=sz)return;
  const key=s+'|'+sz;let ns=book.xfSmall[key];
  if(ns==null){
    const st=book.stDoc,fonts=st.getElementsByTagName('fonts')[0],cx=st.getElementsByTagName('cellXfs')[0];if(!fonts||!cx)return;
    const ox=cx.children[s],font=fonts.children[+(ox.getAttribute('fontId')||0)].cloneNode(true);
    let z=font.getElementsByTagName('sz')[0];if(!z){z=st.createElementNS(NS,'sz');font.insertBefore(z,font.firstChild)}z.setAttribute('val',sz);
    fonts.appendChild(font);fonts.setAttribute('count',fonts.children.length);
    const nx=ox.cloneNode(true);nx.setAttribute('fontId',fonts.children.length-1);nx.setAttribute('applyFont','1');
    cx.appendChild(nx);cx.setAttribute('count',cx.children.length);
    ns=book.xfSmall[key]=cx.children.length-1;book.xfs[ns]={...xf,sz};book.stDirty=true}
  c.setAttribute('s',ns);sh.dirty=true}
/* 文字数から必要な行の高さ(pt)を見積もる */
function needHeight(book,sh,ref,text){
  if(!text)return 0;const{c}=splitRef(ref);const xf=xfOf(book,sh,ref);
  let w=8.43;for(const k of sh.cols)if(c>=k.min&&c<=k.max){w=k.w;break}
  const cpl=Math.max(1,Math.floor((w*7+5)/(xf.sz*96/72)*2)/2);
  let lines=0;for(const para of text.split('\n')){let u=0;for(const ch of para)u+=ch.charCodeAt(0)<0x100?0.5:1;lines+=Math.max(1,Math.ceil(u/cpl))}
  return lines*xf.sz*1.3+6;
}

/* ================= 点検表の構造を読み取る =================
   行番号・項番は決め打ちせず、見出し行の文字列を目印にする。 */
function parseModel(book){
  const main=book.sheets.find(s=>s.name==='点検表')||book.sheets[0];
  const sh=getSheet(book,main.path);
  const V=ref=>cellRaw(book,sh,ref);
  const maxR=Math.max(0,...sh.rows.keys());
  const m={sheetPath:main.path,title:'',sub:'',fields:[],types:[],sections:[],items:[],choices:[],kubun:null};
  let sec=null,norm=null,typeHdr=0,dateCol='',personCol='',kCol='C',svCol='D',firstHdr=0;
  const seen=new Map();
  for(let r=1;r<=maxR;r++){
    const a=nz(V('A'+r)),b=nz(V('B'+r));
    if(!typeHdr&&!firstHdr&&a.startsWith('点検種別')){
      for(let c=2;c<=12;c++){const t=nz(V(colName(c)+r));if(t==='実施日')dateCol=colName(c);if(t==='点検者')personCol=colName(c)}
      if(dateCol||personCol)typeHdr=r;continue}
    if(a==='番号'&&b==='規範項目'){
      if(!firstHdr)firstHdr=r;
      let fc='';for(let c=3;c<=12;c++)if(nz(V(colName(c)+r))==='分野')fc=colName(c);
      let title='';
      for(let k=r-1;k>=Math.max(1,r-3);k--){const aa=V('A'+k).trim();if(!aa)continue;if(!nz(V('B'+k))&&nz(aa)!=='番号')title=aa;break}
      if(title&&(!sec||sec.title!==title)){sec={title,norms:[]};m.sections.push(sec)}
      if(!sec){sec={title:'点検項目',norms:[]};m.sections.push(sec)}
      norm={id:V('A'+(r+1)).trim(),text:V('B'+(r+1)),field:fc?V(fc+(r+1)).trim():'',expl:'',items:[]};
      if(nz(V('A'+(r+2)))==='解説')norm.expl=V('B'+(r+2));
      sec.norms.push(norm);r++;continue}
    if(a==='番号'&&b==='点検項目'){
      if(!firstHdr)firstHdr=r;
      const cols={};
      for(let c=3;c<=14;c++){const t=nz(V(colName(c)+r)),L=colName(c);
        if(t==='区分')cols.k=L;else if(t==='自己点検')cols.sv=L;else if(t==='二者点検')cols.av=L;
        else if(t==='コメント'){if(cols.av)cols.ac=L;else cols.sc=L}}
      if(!cols.sv&&!cols.av)continue;
      if(cols.k)kCol=cols.k;if(cols.sv)svCol=cols.sv;
      if(!sec){sec={title:'点検項目',norms:[]};m.sections.push(sec)}
      if(!norm){norm={id:'',text:'',field:'',expl:'',items:[]};sec.norms.push(norm)}
      let r2=r+1;
      const inputRow=q=>['k','sv','sc','av','ac'].some(f=>cols[f]&&unlocked(book,sh,cols[f]+q));
      const strict=inputRow(r2); /* 入力セル（ロック解除）のある行だけを点検項目とみなす */
      for(;r2<=maxR;r2++){
        const id=V('A'+r2).trim();if(!id||nz(id)==='番号')break;
        if(strict?!inputRow(r2):!nz(V('B'+r2)))break;
        const n=(seen.get(id)||0)+1;seen.set(id,n);
        const it={row:r2,id,key:n>1?id+'#'+n:id,text:V('B'+r2),ref:{},v:{}};
        for(const f of['k','sv','sc','av','ac']){if(cols[f]){it.ref[f]=cols[f]+r2;it.v[f]=V(cols[f]+r2).replace(/\r/g,'')}else it.v[f]=''}
        norm.items.push(it);m.items.push(it)}
      r=r2-1;continue}
  }
  if(!m.items.length)throw new Error('点検項目が見つかりません。見出し行（番号／点検項目／区分／自己点検／コメント／二者点検／コメント）のあるExcel点検表を選んでください');
  /* 表紙 */
  const lines=[];for(let r=2;r<=6;r++){const t=V('A'+r).trim();if(t)lines.push(t.replace(/\s+/g,' '))}
  m.title=lines[1]||lines[0]||'';m.sub=lines[2]||'';
  const coverEnd=typeHdr||Math.min(firstHdr,20);
  const fl=[];
  for(const ref of sh.cells.keys()){const p=splitRef(ref);if(p.r<coverEnd&&unlocked(book,sh,ref))fl.push({ref,...p})}
  fl.sort((x,y)=>x.r-y.r||x.c-y.c);
  for(const f of fl){
    let label=f.c>1?V(colName(f.c-1)+f.r).trim():'';if(!label&&f.r>1)label=V(f.col+(f.r-1)).trim();
    m.fields.push({ref:f.ref,label:label.replace(/\s+/g,' ')||f.ref,value:V(f.ref)})}
  if(typeHdr){
    for(let r=typeHdr+1;r<typeHdr+15;r++){
      const dr=dateCol?dateCol+r:'',pr=personCol?personCol+r:'';
      if(!(dr&&unlocked(book,sh,dr))&&!(pr&&unlocked(book,sh,pr)))break;
      m.types.push({row:r,label:V('A'+r),labelEdit:unlocked(book,sh,'A'+r),dateRef:dr,personRef:pr,date:dr?readDate(book,sh,dr):'',person:pr?V(pr):''})}
  }
  /* 選択肢（入力規則から） */
  for(const dv of sh.doc.getElementsByTagName('dataValidation')){
    const f=dv.getElementsByTagName('formula1')[0];if(!f)continue;const s=f.textContent.trim();
    const sq=(dv.getAttribute('sqref')||'').split(/\s+/);
    if(/^".*"$/.test(s)&&sq.some(x=>x.startsWith(svCol))){m.choices=s.slice(1,-1).split(',').map(x=>x.trim()).filter(Boolean);break}}
  if(!m.choices.length)m.choices=['○','✕','ー'];
  /* 区分の選択肢（区分シート） */
  const tryRange=(f,sq)=>{
    if(m.kubun||!sq.split(/\s+/).some(x=>x.startsWith(kCol)))return;
    const mm=/^'?(.+?)'?!\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)$/.exec(f.trim());if(!mm)return;
    const s=book.sheets.find(x=>x.name===mm[1]);if(!s||!book.files[s.path])return;
    const ks=getSheet(book,s.path);const refs=[],values=[];
    for(let r=+mm[3];r<=+mm[5];r++){const ref=mm[2]+r,val=cellRaw(book,ks,ref);if(!refs.length&&nz(val)==='区分')continue;refs.push(ref);values.push(val)}
    m.kubun={path:s.path,refs,values}};
  for(const x of sh.doc.getElementsByTagName('x14:dataValidation')){
    const f=x.getElementsByTagName('xm:f')[0],q=x.getElementsByTagName('xm:sqref')[0];if(f&&q)tryRange(f.textContent,q.textContent)}
  for(const dv of sh.doc.getElementsByTagName('dataValidation')){
    const f=dv.getElementsByTagName('formula1')[0];if(f)tryRange(f.textContent,dv.getAttribute('sqref')||'')}
  /* 区分シートがなく、入力規則に直接書かれている場合（2023年版など）は並び順だけ使う */
  m.kubunOrder=[];
  if(!m.kubun)for(const dv of sh.doc.getElementsByTagName('dataValidation')){
    const f=dv.getElementsByTagName('formula1')[0];if(!f)continue;const t=f.textContent.trim();
    if(/^".*"$/.test(t)&&(dv.getAttribute('sqref')||'').split(/\s+/).some(x=>x.startsWith(kCol))){m.kubunOrder=t.slice(1,-1).split(',').map(nz).filter(Boolean);break}}
  return m;
}

/* ================= 状態 ================= */
const colForLabel=l=>{l=nz(l);if(!l||l.includes('自己点検'))return'self';return'second'};
const labelName=l=>{l=nz(l);const p=/[（(](.+?)[）)]/.exec(l);if(p)return p[1];const q=l.split(/[:：]/)[1];return q||l};
function detectLabel(m){const c=m.types.filter(t=>colForLabel(t.label)==='self'&&(t.date||t.person));return c.length===1?labelName(c[0].label):''}
function newState(m){
  const s={v:1,fields:{},types:{},items:{},kubun:m.kubun?m.kubun.values.slice():null,kubunEdit:false,sources:[],baseLabel:detectLabel(m),fmt:'nl',
    sel:{type:null,col:'self'},my:[],sec:0,filt:'all',tab:'info',memo:{items:{}},prev:[],showPrev:true};
  for(const f of m.fields)s.fields[f.ref]=f.value;
  for(const t of m.types)s.types[t.row]={label:t.label,date:t.date,person:t.person};
  for(const it of m.items)s.items[it.key]={...it.v};
  return s;
}
const NORM={'×':'✕','Ｘ':'✕','X':'✕','x':'✕','✖':'✕','〇':'○','◯':'○','－':'ー','-':'ー','―':'ー','—':'ー','ｰ':'ー'};
const same=(a,b)=>a!==''&&((NORM[a]||a)===(NORM[b]||b));
function selfParts(S,key){
  const out=[],b=S.items[key];
  if(b&&(b.sv||b.sc))out.push({label:S.baseLabel||(S.sources.length?'自己点検1':''),v:b.sv,c:b.sc});
  for(const s of S.sources){const x=s.items[key];if(x&&(x.v||x.c))out.push({label:s.label,v:x.v,c:x.c})}
  /* 区分シートの並び順（例：生産者→団体）にそろえる */
  const ord=l=>{const i=(S.kubun||(cur&&cur.m.kubunOrder)||[]).findIndex(k=>nz(k)===nz(l));return i<0?99:i};
  return out.map((x,i)=>[ord(x.label),i,x]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);
}
function selfOut(S,key){
  const p=selfParts(S,key);if(!p.length)return{v:'',c:''};if(p.length===1)return{v:p[0].v,c:p[0].c};
  /* 既存の点検表アプリと同じ書式：結果「生○(改行)団✕」、コメント「生：…(改行)団：…」 */
  const h=x=>[...(x.label||'？')][0];
  return{v:p.filter(x=>x.v).map(x=>h(x)+x.v).join('\n'),c:p.filter(x=>x.c).map(x=>h(x)+'：'+x.c).join('\n')};
}

/* ================= 書き出し ================= */
function buildXlsx(rec){
  const book=openBook(rec.bytes),m=parseModel(book),sh=getSheet(book,m.sheetPath),S=rec.state;
  const put=(s,ref,val)=>{val=String(val??'').replace(/\r/g,'');if(val===cellRaw(book,s,ref).replace(/\r/g,''))return false;setCell(book,s,ref,val);return true};
  for(const f of m.fields)if(f.ref in S.fields)put(sh,f.ref,S.fields[f.ref]);
  for(const t of m.types){
    const x=S.types[t.row];if(!x)continue;
    if(t.labelEdit)put(sh,'A'+t.row,x.label);
    if(t.personRef)put(sh,t.personRef,x.person);
    if(t.dateRef&&x.date!==t.date){
      if(!x.date)setCell(book,sh,t.dateRef,'');
      else if(xfOf(book,sh,t.dateRef).date)setCell(book,sh,t.dateRef,String(serialFromIso(x.date)),true);
      else setCell(book,sh,t.dateRef,x.date.replace(/-0?/g,'/'))}
  }
  for(const it of m.items){
    const x=S.items[it.key];if(!x)continue;const so=selfOut(S,it.key),ao=auditOut(S,it.key);
    const vals={k:x.k,sv:so.v,sc:so.c,av:ao.v,ac:ao.c};let ch=false;
    for(const f of['k','sv','sc','av','ac'])if(it.ref[f]&&put(sh,it.ref[f],vals[f]))ch=true;
    for(const f of['sv','av'])if(it.ref[f])shrinkFont(book,sh,it.ref[f],vals[f]);
    if(ch){
      let need=0;for(const f of['sv','sc','av','ac'])if(it.ref[f])need=Math.max(need,needHeight(book,sh,it.ref[f],vals[f]));
      const row=sh.rows.get(it.row),cur=+(row.getAttribute('ht')||0);
      if(need>cur&&cur>0){row.setAttribute('ht',Math.min(409,need).toFixed(2));row.setAttribute('customHeight','1')}
    }
  }
  if(m.kubun&&S.kubun){const ks=getSheet(book,m.kubun.path);m.kubun.refs.forEach((ref,i)=>put(ks,ref,S.kubun[i]||''))}
  for(const p in book.loaded)if(book.loaded[p].dirty)book.files[p]=enc.encode(serXml(book.loaded[p].doc));
  if(book.sstDoc)book.files['xl/sharedStrings.xml']=enc.encode(serXml(book.sstDoc));
  if(book.stDirty)book.files['xl/styles.xml']=enc.encode(serXml(book.stDoc));
  const out={};for(const p in book.files)if(!p.startsWith('[trash]')&&!p.endsWith('/'))out[p]=book.files[p];
  return fflate.zipSync(out,{level:6});
}

/* ================= 端末内保存（IndexedDB） ================= */
const store={
  mem:null,db:null,
  async open(){
    if(this.db||this.mem)return;
    try{this.db=await new Promise((ok,ng)=>{const q=indexedDB.open('tenken-excel',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};q.onsuccess=()=>ok(q.result);q.onerror=()=>ng(q.error)});
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}
    catch(e){this.mem=new Map();this.pmem=new Map()}
  },
  tx(mode,fn,name='sessions'){return new Promise((ok,ng)=>{const t=this.db.transaction(name,mode);const q=fn(t.objectStore(name));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ng(t.error)})},
  async phPut(id,r){await this.open();if(this.mem){this.pmem.set(id,r);return}return this.tx('readwrite',s=>s.put(r,id),'photos')},
  async phGet(id){await this.open();return this.mem?this.pmem.get(id):this.tx('readonly',s=>s.get(id),'photos')},
  async phDel(id){await this.open();if(this.mem){this.pmem.delete(id);return}return this.tx('readwrite',s=>s.delete(id),'photos')},
  async all(){await this.open();return this.mem?[...this.mem.values()]:this.tx('readonly',s=>s.getAll())},
  async get(id){await this.open();return this.mem?this.mem.get(id):this.tx('readonly',s=>s.get(id))},
  async put(rec){await this.open();if(this.mem){this.mem.set(rec.id,rec);return}return this.tx('readwrite',s=>s.put(rec))},
  async del(id){await this.open();if(this.mem){this.mem.delete(id);return}return this.tx('readwrite',s=>s.delete(id))}
};

const fmtTime=t=>{const d=new Date(t);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const activeCol=S=>S.sel.col==='second'?'av':'sv';
const NGV=()=>cur.m.choices[1]||'✕';
/* 区分「両方」の項目は、内部監査・二者点検のとき生産者と団体に分けて評価する */
function parties(S){const l=(S.kubun||cur.m.kubunOrder||[]).map(nz).filter(k=>k&&k!=='両方');return l.length===2?l:['生産者','団体']}
const isBoth=(S,key)=>S.sel.col==='second'&&nz(S.items[key].k)==='両方';
function avParts(S,key){const x=S.items[key];if(!x.avp){const ps=splitCombined(x.av,x.ac);x.avp=parties(S).map(n=>{const q=ps&&ps.find(z=>z.h===[...n][0]);return{v:q?q.v:'',c:q?q.c:''}})}return x.avp}
function auditOut(S,key){const x=S.items[key];
  if(nz(x.k)==='両方'&&x.avp&&x.avp.some(q=>q.v||q.c)){const P=parties(S),h=i=>[...P[i]][0];
    return{v:x.avp.map((q,i)=>q.v?h(i)+q.v:'').filter(Boolean).join('\n'),c:x.avp.map((q,i)=>q.c?h(i)+'：'+q.c:'').filter(Boolean).join('\n')}}
  return{v:x.av,c:x.ac}}
function units(S,key){const x=S.items[key];
  if(isBoth(S,key)){const P=parties(S);return avParts(S,key).map((q,i)=>({v:q.v,c:q.c,label:P[i]}))}
  return S.sel.col==='second'?[{v:x.av,c:x.ac}]:[{v:x.sv,c:x.sc}]}
function setUnit(S,key,i,f,val){const x=S.items[key];if(isBoth(S,key))avParts(S,key)[i][f]=val;else x[(S.sel.col==='second'?'a':'s')+f]=val}
/* 自己点検の結果（まとめたセル「生○／団✕」は自己点検者ごとに分ける） */
function selfView(S,key){const out=[],P=parties(S);for(const p of selfParts(S,key)){const ps=splitCombined(p.v,p.c);
  if(ps)ps.forEach(q=>out.push({label:P.find(n=>[...n][0]===q.h)||q.h,v:q.v,c:q.c}));else out.push(p)}return out}
/* 自己点検と評価が異なるのにコメントがない */
function needComment(S,key){if(S.sel.col!=='second')return false;const sv=selfView(S,key);
  return units(S,key).some(u=>{if(!u.v||String(u.c||'').trim())return false;
    const rel=u.label?sv.filter(p=>!p.label||[...nz(p.label)][0]===[...u.label][0]):sv;return rel.some(p=>p.v&&!same(p.v,u.v))})}
const itemDone=(S,key)=>units(S,key).every(u=>u.v);
const itemNg=(S,key)=>units(S,key).some(u=>same(u.v,NGV()));
function itemCat(S,key){const u=units(S,key),na=cur.m.choices[2];if(u.some(q=>same(q.v,NGV())))return'ng';if(!u.every(q=>q.v))return'';return na&&u.some(q=>same(q.v,na))?'na':'ok'}
function counts(S,items){const c={done:0,ok:0,ng:0,na:0,need:0,chk:0,memo:0,total:items.length},na=cur.m.choices[2];
  for(const it of items){const u=units(S,it.key),d=u.every(q=>q.v);if(d)c.done++;
    if(u.some(q=>same(q.v,NGV())))c.ng++;else if(d){if(na&&u.some(q=>same(q.v,na)))c.na++;else c.ok++}
    if(needComment(S,it.key))c.need++;const mm=S.memo.items[it.key];if(mm&&mm.chk)c.chk++;if(mm&&(mm.t||(mm.ph&&mm.ph.length)))c.memo++}
  return c}
function kubunNames(S,m){const set=[];const add=v=>{v=nz(v);if(v&&!set.includes(v))set.push(v)};(S.kubun||m.kubunOrder||[]).forEach(add);for(const it of m.items)add(S.items[it.key].k);return set}
const inMy=(S,it)=>!S.my.length||S.my.includes(nz(S.items[it.key].k));
function typeLabel(S){const t=S.sel.type!=null&&S.types[S.sel.type];return t?nz(t.label):''}

function prevList(it,second){const S=cur.rec.state,out=[];
  S.prev.forEach(r=>{const x=r.items[it.key];if(!x)return;
    const self=()=>{if(!x.sv&&!x.sc)return;const d=r.sdate?' '+jdate(r.sdate):'',ps=splitCombined(x.sv,x.sc);
      if(ps)ps.forEach(q=>out.push({lab:'前回 自己点検（'+q.h+'）'+d,v:q.v,c:q.c,copy:!second}));else out.push({lab:'前回 自己点検'+d,v:x.sv,c:x.sc,copy:!second})};
    const aud=()=>{if(!x.av&&!x.ac)return;const d=r.adate?' '+jdate(r.adate):'',kd=r.akind||'二者点検',ps=splitCombined(x.av,x.ac);
      if(ps)ps.forEach(q=>out.push({lab:'前回 '+kd+'（'+q.h+'）'+d,v:q.v,c:q.c,h:q.h,copy:second}));else out.push({lab:'前回 '+kd+d,v:x.av,c:x.ac,copy:second})};
    self();aud()});
  return out}
function prevHtml(it,second){const S=cur.rec.state;if(!S.showPrev||!S.prev.length)return'';const l=prevList(it,second);if(!l.length)return'';
  return`<div class="refs">${l.map((x,n)=>`<div class="ref"><span class="rl">${esc(x.lab)}</span><b class="vv">${esc(x.v||'—')}</b>${x.copy?`<button class="pvc" data-act="pv-copy" data-n="${n}">コピー</button>`:''}${x.c?`<span class="rc">${esc(x.c)}</span>`:''}</div>`).join('')}</div>`}
async function addPrev(fileList){const{m,rec}=cur,S=rec.state;const keys=new Set(m.items.map(i=>i.key));let added=0;
  for(const file of fileList){try{
    const m2=parseModel(openBook(await file.arrayBuffer()));
    if(nz(m2.title)!==nz(m.title)){toast(`${file.name}：別の点検表のため読み込めません`,5000);continue}
    const items={};let n=0;
    for(const it of m2.items){if(!keys.has(it.key))continue;const v=it.v;if(v.sv||v.sc||v.av||v.ac){items[it.key]={sv:v.sv,sc:v.sc,av:v.av,ac:v.ac};n++}}
    if(!n){toast(`${file.name}：点検結果が入っていないか、項番が一致しません`,5000);continue}
    const ts=m2.types.filter(t=>t.date||t.person),ss=ts.filter(t=>colForLabel(t.label)==='self'),as=ts.filter(t=>colForLabel(t.label)==='second');
    const mx=a=>a.map(t=>t.date).filter(Boolean).sort().pop()||'';
    S.prev=S.prev.filter(r=>r.file!==file.name);
    S.prev.push({file:file.name,n,items,sdate:mx(ss),adate:mx(as),akind:as.map(t=>nz(t.label)).join('・')});added++;
    const miss=m2.items.length-m2.items.filter(i=>keys.has(i.key)).length;if(miss)toast(`${file.name}：今回の点検表にない項番が ${miss} 件あります（版が違う可能性があります）`,5000);
  }catch(e){toast(`${file.name}：${e.message}`,5000)}}
  if(added){S.showPrev=true;save();renderTab();toast(`前回の結果を ${added}件 読み込みました`)}}

/* ================= 操作 ================= */
function refreshProgress(){const S=cur.rec.state;const c=counts(S,cur.m.items.filter(it=>inMy(S,it)));const p=$('#pg');if(!p)return;p.textContent=progText(c);$('#pgbar').style.width=(c.total?c.done/c.total*100:0)+'%';
  c.todo=secTodo(S);document.querySelectorAll('[data-cnt]').forEach(b=>{b.textContent=c[b.dataset.cnt]})}
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab&&cur){cur.rec.state.tab=tab.dataset.tab;cur.rec.summary=summaryOf(cur.rec.state,cur.m);save();renderTab();return}
  const ch=e.target.closest('.ch');
  if(ch&&cur){const S=cur.rec.state,key=ch.closest('.item').dataset.key,i=+ch.closest('.choices').dataset.pi,u=units(S,key)[i];
    setUnit(S,key,i,'v',same(u.v,ch.dataset.ch)?'':ch.dataset.ch);refreshCard(key);save();return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='about'){renderAbout();return}
  if(act==='tohome'){renderHome();return}
  if(act==='new'){$('#fileNew').value='';$('#fileNew').click()}
  else if(act==='open')openSession(b.dataset.id);
  else if(act==='del'){if(confirm('この点検の保存データ（自分用メモと写真を含む）を削除します。よろしいですか？')){const r=await store.get(b.dataset.id);if(r&&r.state&&r.state.memo)for(const m of Object.values(r.state.memo.items))for(const x of m.ph||[])await store.phDel(x).catch(()=>{});await store.del(b.dataset.id);renderHome()}}
  else if(act==='home'){cur.rec.summary=summaryOf(cur.rec.state,cur.m);await flush();renderHome()}
  else if(act==='addsrc'){$('#fileAdd').value='';$('#fileAdd').click()}
  else if(act==='delsrc'){cur.rec.state.sources.splice(+b.dataset.i,1);save();renderTab()}
  else if(act==='filt'){const S=cur.rec.state,f=b.dataset.f;S.filt=S.filt===f?'all':f;save();renderTab()}
  else if(act==='my'){const S=cur.rec.state,k=b.dataset.k,i=S.my.indexOf(k);if(i>=0)S.my.splice(i,1);else S.my.push(k);save();renderTab()}
  else if(act==='prev'){cur.rec.state.sec--;save();renderTab()}
  else if(act==='next'){const S=cur.rec.state;if(S.sec>=cur.m.sections.length-1)S.tab='out';else S.sec++;save();renderTab()}
  else if(act==='m-open'){const mm=b.closest('.mm');openM.add(mm.dataset.mk);mm.classList.add('open');mm.querySelector('textarea').focus()}
  else if(act==='m-chk'){const k=b.closest('.mm').dataset.mk,on=!mGet(k).chk;mSet(k,{chk:on});b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.textContent=(on?'★':'☆')+' 後で確認';refreshProgress()}
  else if(act==='m-photo'){mTarget=b.closest('.mm').dataset.mk;$('#filePhoto').value='';$('#filePhoto').click()}
  else if(act==='m-view'){const k=b.closest('.mm').dataset.mk,pid=b.dataset.ph;let bm=null;try{bm=await phBmp(pid)}catch(err){}
    if(!bm){toast('写真が見つかりません（この端末に保存されていません）',4000);return}
    mView={k,pid};$('#modal').innerHTML=`<div class="modal" data-act="m-bg"><div class="sheet"><h2>写真（${esc(k==='_all'?'全体のメモ':k)}）</h2><canvas class="pvbig" id="pvbig"></canvas><p class="note">自分用メモの写真です。このツール内だけに保存され、端末への保存・コピーはできません。Excel点検表には含まれません。</p><div class="btns"><button class="btn danger" data-act="m-ph-del">この写真を削除</button><button class="btn" data-act="m-close">閉じる</button></div></div></div>`;
    drawPh($('#pvbig'),bm,false)}
  else if(act==='m-bg'){if(e.target===b)closeModal()}
  else if(act==='m-close')closeModal();
  else if(act==='m-ph-del'){const v=mView;if(!v||!confirm('この写真を削除しますか？（元に戻せません）'))return;mSet(v.k,{ph:(mGet(v.k).ph||[]).filter(x=>x!==v.pid)});await phDrop(v.pid);closeModal();refreshMemo(v.k);toast('削除しました')}
  else if(act==='m-txt'){download(new Blob([memoText()],{type:'text/plain'}),outName().replace(/\.xlsx$/,'')+'_自分用メモ.txt');toast('自分用メモを保存しました（写真は含まれません）')}
  else if(act==='m-clear'){const S=cur.rec.state,s=mStats(S);if(!confirm(`この点検の自分用メモと写真を消去します（メモ ${s.n}件・★後で確認 ${s.chk}件・写真 ${s.ph}枚）。\n消去したものは元に戻せません。点検結果は消えません。\n\nよろしいですか？`))return;await memoClear(S);openM.clear();save();renderTab();toast('メモと写真を消去しました')}
  else if(act==='pv-load'){$('#filePrev').value='';$('#filePrev').click()}
  else if(act==='pv-del'){cur.rec.state.prev.splice(+b.dataset.i,1);save();renderTab()}
  else if(act==='pv-toggle'){const S=cur.rec.state;S.showPrev=!S.showPrev;save();const y=scrollY;renderTab();window.scrollTo(0,y)}
  else if(act==='pv-copy'){const S=cur.rec.state,second=S.sel.col==='second',card=b.closest('.item'),key=card.dataset.key,it=cur.m.items.find(x=>x.key===key);
    const a=prevList(it,second)[+b.dataset.n];if(!a)return;const us=units(S,key),P=parties(S);
    const idx=us.length>1?(a.h?[P.findIndex(n=>[...n][0]===a.h)].filter(i=>i>=0):us.map((u,i)=>i)):[0];if(!idx.length)return;
    if(idx.some(i=>(us[i].v||us[i].c)&&!(us[i].v===a.v&&us[i].c===a.c))&&!confirm('いまの入力を、前回の内容で置き換えますか？'))return;
    idx.forEach(i=>{setUnit(S,key,i,'v',a.v||'');setUnit(S,key,i,'c',a.c||'')});save();refreshCard(key);toast('前回の内容をコピーしました。内容を確認し、必要なら修正してください')}
  else if(act==='export')doExport(false);
  else if(act==='share')doExport(true);
});
function onInput(e){
  const el=e.target,b=el.dataset&&el.dataset.b;if(!b||!cur)return;const S=cur.rec.state,v=el.value;
  if(b==='q'){Q=v;clearTimeout(qT);qT=setTimeout(()=>{const l=$('#list');if(l){l.innerHTML=listHtml();hydPh()}},200);return}
  if(b==='cm'){const card=el.closest('.item'),key=card.dataset.key;setUnit(S,key,+el.dataset.pi,'c',v.replace(/\r/g,''));
    const w=card.querySelector('.wm');if(w)w.hidden=!needComment(S,key);refreshProgress()}
  else if(b==='mt'){mSet(el.closest('.mm').dataset.mk,{t:v.replace(/\r/g,'')});refreshProgress();return}
  else if(b==='ik'){S.items[el.closest('.item').dataset.key].k=v}
  else if(b==='field'){S.fields[el.dataset.ref]=el.type==='date'?v.replace(/-0?/g,'/'):v}
  else if(b==='tlabel'){S.types[el.dataset.row].label=v;if(S.sel.type==el.dataset.row)S.sel.col=colForLabel(v)}
  else if(b==='tdate'){S.types[el.dataset.row].date=v}
  else if(b==='tperson'){S.types[el.dataset.row].person=v}
  else if(b==='baselabel'){S.baseLabel=v.trim()}
  else if(b==='srclabel'){S.sources[+el.dataset.i].label=v.trim()}
  else if(b==='kubun'){S.kubun[+el.dataset.i]=v}
  else if(e.type==='change'){
    if(b==='seltype'){S.sel.type=v===''?null:+v;if(v==='')S.sel.col='self';if(v!==''){S.sel.col=colForLabel(S.types[+v].label);const t=S.types[+v];if(!t.date)t.date=today()}renderTab()}
    else if(b==='selcol'){S.sel.col=v}
    else if(b==='kubunedit'){S.kubunEdit=el.checked}
    else if(b==='sec'){S.sec=+v;if(S.filt!=='todo')S.filt='all';Q='';renderTab()}
    else if(b==='filt'){S.filt=v;renderTab()}
  }
  save();
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
$('#fileNew').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{await createSession(f)}catch(err){console.error(err);toast(err.message,6000)}});
$('#fileAdd').addEventListener('change',e=>{if(e.target.files.length)addSources([...e.target.files])});
$('#filePrev').addEventListener('change',e=>{if(e.target.files.length)addPrev([...e.target.files])});
$('#filePhoto').addEventListener('change',async e=>{const fs=[...e.target.files],k=mTarget;if(!fs.length||!k||!cur)return;toast('写真を取り込み中…',1500);let n=0;const errs=[];
  for(const f of fs){try{const r=await shrink(f);const pid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);await store.phPut(pid,r);mSet(k,{ph:[...(mGet(k).ph||[]),pid]});n++}catch(err){errs.push(err.message)}}
  openM.add(k);refreshMemo(k);toast((n?`写真を ${n}枚 追加しました（このツール内だけに保存）`:'')+(errs.length?'\n'+errs.join('\n'):''),errs.length?5000:2500)});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('canvas[data-ph],#pvbig,.pth'))e.preventDefault()});
window.addEventListener('pagehide',()=>{flush()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

renderHome();
</script>
